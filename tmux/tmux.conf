run-shell 'if [ ! -d "$XDG_DATA_HOME/tmux/plugins/tpm" ]; then; git clone https://github.com/tmux-plugins/tpm $XDG_DATA_HOME/tmux/plugins/tpm; fi'

set -g default-terminal "tmux-256color"
set-option -g allow-passthrough on
 set -sg escape-time 0

bind-key -T prefix C-h select-pane -L
bind-key -T prefix C-l select-pane -R
bind-key -T prefix C-k select-pane -U
bind-key -T prefix C-j select-pane -D

set -g @plugin "tmux-plugins/tpm"

set -g @plugin 'Morantron/tmux-fingers'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes '$HOMEBREW_CELLAR/python@3.11/3.11.5/Frameworks/Python.framework/Versions/3.11/Resources/Python.app/Contents/MacOS/Python -O /opt/homebrew/bin/ranger --choosedir=/Users/kamalsacranie/.config/ranger/.lastdir'

run "$XDG_DATA_HOME/tmux/plugins/tpm/tpm"
